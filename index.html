<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="description" content="Sanguine – survivez trente minutes. Elle ne viendra pas." />

    <!--
      Cartes de partage.
      L'image est produite par `src/og.ts` et photographiée par `tools/og.mjs` : elle sort
      des générateurs du jeu, donc elle suit chaque refonte de sprites au lieu de vieillir.
      Les URL doivent être absolues – les réseaux ne résolvent pas les chemins relatifs.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sanguine" />
    <meta property="og:title" content="Sanguine – survivez trente minutes" />
    <meta property="og:description" content="Un survivor-like jouable dans le navigateur. Vous ne tirez jamais : vos armes se déclenchent seules. Tout est généré par le code, rien n'est téléchargé." />
    <meta property="og:url" content="https://sanguine.ascencia.re/" />
    <meta property="og:image" content="https://sanguine.ascencia.re/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logo de Sanguine dont le sang coule, au-dessus d'une lande nocturne et d'une rangée de créatures." />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sanguine – survivez trente minutes" />
    <meta name="twitter:description" content="Un survivor-like jouable dans le navigateur. Zéro dépendance, zéro fichier binaire : tout est généré par le code." />
    <meta name="twitter:image" content="https://sanguine.ascencia.re/og.png" />
    <meta name="theme-color" content="#0b0d14" />
    <title>Sanguine</title>
    <!-- Favicon en ligne : garde la promesse « aucun asset externe », et évite un 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d14'/%3E%3Cpath d='M8 3 L11 8 Q11 12 8 13 Q5 12 5 8 Z' fill='%23c42639'/%3E%3Cpath d='M8 5 L9.6 8.2 Q9.6 10.6 8 11.3 Z' fill='%23f0405a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="ui"></div>
    </div>
    <noscript>
      <p class="noscript-msg">
        Sanguine a besoin de JavaScript pour fonctionner.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
