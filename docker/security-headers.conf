# En-têtes de sécurité, inclus depuis chaque bloc qui en a besoin.
#
# Piège nginx : `add_header` n'est PAS hérité par un `location` qui déclare son propre
# `add_header`. Poser ces lignes une seule fois dans le bloc `server` les ferait donc
# disparaître sur les fichiers hachés et sur index.html — précisément les deux réponses
# qui comptent. D'où un fichier inclus explicitement partout où c'est nécessaire.
#
# `always` étend l'envoi aux réponses d'erreur, pas seulement aux 200.

# Le jeu ne charge rien depuis l'extérieur : ni police, ni analytics, ni CDN. La politique
# se contente donc de le constater, ce qui la rend aussi stricte que possible. `data:` reste
# autorisé en image : les sprites, cadres, ornements et curseurs sont produits par
# `canvas.toDataURL()` au démarrage. `connect-src 'none'` fait de l'absence de requête
# sortante une garantie vérifiable par le navigateur, et plus une promesse du README.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Le jeu n'utilise aucune de ces interfaces. Les refuser coupe court à toute tentative
# d'un script tiers qui parviendrait malgré tout à s'exécuter.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
