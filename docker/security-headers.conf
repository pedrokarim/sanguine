# En-têtes de sécurité, inclus depuis chaque bloc qui en a besoin.
#
# Piège nginx : `add_header` n'est PAS hérité par un `location` qui déclare son propre
# `add_header`. Poser ces lignes une seule fois dans le bloc `server` les ferait donc
# disparaître sur les fichiers hachés et sur index.html — précisément les deux réponses
# qui comptent. D'où un fichier inclus explicitement partout où c'est nécessaire.
#
# `always` étend l'envoi aux réponses d'erreur, pas seulement aux 200.

# Le jeu ne **charge** toujours rien depuis l'extérieur : ni police, ni script, ni CDN.
# `data:` reste autorisé en image : les sprites, cadres, ornements et curseurs sont produits
# par `canvas.toDataURL()` au démarrage.
#
# `connect-src` valait 'none', et c'était la meilleure ligne de ce fichier : elle faisait de
# l'absence de requête sortante une garantie vérifiable par le navigateur plutôt qu'une
# promesse du README. La mesure d'audience coûte cette garantie, et il faut le dire ainsi
# plutôt que de l'enterrer — c'est un arbitrage, pas un détail de configuration.
#
# Ce qui reste vrai, et que l'énumération d'un hôte unique préserve : une seule destination
# est joignable, en écriture seule, et tout le reste du web demeure hors d'atteinte. Un
# script tiers qui parviendrait à s'exécuter ne pourrait toujours exfiltrer nulle part
# ailleurs. La liste est explicite pour que toute destination supplémentaire exige une
# modification visible de ce fichier.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://sarutobi.ascencia.re; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Le jeu n'utilise aucune de ces interfaces. Les refuser coupe court à toute tentative
# d'un script tiers qui parviendrait malgré tout à s'exécuter.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
