# Configuration nginx *du conteneur*. Le nginx système de l'hôte fait le reverse proxy
# devant, et Cloudflare assure le TLS — ce serveur-ci n'écoute donc qu'en HTTP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Masque la version exacte de nginx dans la bannière `Server`.
    server_tokens off;

    # Le jeu ne charge aucun asset externe ; tout est inline ou généré au runtime.
    # La compression reste utile : le bundle est du JS et du CSS purs.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite produit des noms de fichiers hachés : ils sont immuables, donc cachables
    # indéfiniment. C'est ce qui rend les visites suivantes instantanées.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        # `expires 1y` émettrait un second Cache-Control : les deux en-têtes partaient
        # ensemble. Une seule directive, valeur complète.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;   # sinon perdus, cf. le fichier
        access_log off;
    }

    # index.html, lui, ne doit JAMAIS être caché : c'est le seul fichier qui pointe vers
    # les noms hachés du moment. Le mettre en cache fige les joueurs sur une vieille version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sonde de santé pour Docker et pour un éventuel superviseur.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }
}
